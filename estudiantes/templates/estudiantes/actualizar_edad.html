<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Actualizar edad</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="bg-white rounded-4 shadow p-4 mx-auto" style="max-width: 600px;">

            <div class="text-center mb-4">

                <div class="fs-1">
                    🎂✨
                </div>

                <h1 class="text-danger fw-bold">
                    Actualizar edad
                </h1>

                <p class="text-secondary">
                    Busca al estudiante por su correo 💕
                </p>

            </div>

            <form method="POST">

                {% csrf_token %}

                <!-- Correo -->
                <div class="mb-3">

                    <label class="form-label fw-bold">
                        📧 Correo del estudiante
                    </label>

                    <input type="email" name="correo" class="form-control" placeholder="ejemplo@correo.com" required>

                </div>

                <!-- Nueva edad -->
                <div class="mb-4">

                    <label class="form-label fw-bold">
                        🎂 Nueva edad
                    </label>

                    <input type="number" name="edad" class="form-control" min="1" max="120" placeholder="Ej: 20"
                        required>

                </div>

                <div class="d-flex justify-content-center gap-3 mt-4">

                    <button type="submit" class="btn btn-danger rounded-pill shadow-sm px-4 py-2 fw-semibold">
                        🎀 Actualizar
                    </button>

                    <a href="{% url 'lista_estudiantes' %}"
                        class="btn btn-outline-danger rounded-pill shadow-sm px-4 py-2 fw-semibold">
                        🏠 Volver
                    </a>

                </div>

            </form>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% if mensaje %}
    <div class="modal fade" id="mensajeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 shadow">

                <div class="modal-header bg-danger-subtle">
                    <h5 class="modal-title text-danger fw-bold">
                        🎀 ¡Actualizado!
                    </h5>
                </div>

                <div class="modal-body text-center">
                    <div class="fs-1 mb-2">
                        🎉🐰✨
                    </div>

                    <p class="mb-0">
                        {{ mensaje }}
                    </p>
                </div>

                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-danger rounded-pill shadow-sm px-4 py-2 fw-semibold"
                        data-bs-dismiss="modal">
                        💕 ¡Listo!
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        const mensajeModal = new bootstrap.Modal(
            document.getElementById('mensajeModal')
        );

        mensajeModal.show();
    </script>
    {% endif %}

</body>

</html>
